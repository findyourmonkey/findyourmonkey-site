const D = 14;          // sweet-spot distance (camera and projector sit here)
const R = 3.0;         // radius of the hidden picture at the flower's face

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35,1,0.1,200);

// The projector is a fixed copy of the sweet-spot camera.
const proj = new THREE.PerspectiveCamera(35,1,0.1,200);
proj.position.set(0,0,D); proj.lookAt(0,0,0); proj.updateMatrixWorld(); proj.updateProjectionMatrix();
const projMat = new THREE.Matrix4().multiplyMatrices(proj.projectionMatrix, proj.matrixWorldInverse);
const edge = new THREE.Vector4(R,0,0,1).applyMatrix4(projMat);
const ndcR = edge.x/edge.w;

const tex = new THREE.TextureLoader().load(TEX, ()=>{ready=true;});
tex.minFilter = THREE.LinearFilter;
let ready=false;

const projMaterial = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms:{ map:{value:tex}, projMat:{value:projMat}, ndcR:{value:ndcR},
             petal:{value:new THREE.Color(0xf6b2c4)}, lightDir:{value:new THREE.Vector3(-0.4,0.6,0.7).normalize()} },
  vertexShader:`
    varying vec3 vW; varying vec3 vN; varying vec2 vUv;
    void main(){
      vec4 w = modelMatrix*vec4(position,1.0);
      vW = w.xyz; vN = normalize(mat3(modelMatrix)*normal); vUv = uv;
      gl_Position = projectionMatrix*viewMatrix*w;
    }`,
  fragmentShader:`
    uniform sampler2D map; uniform mat4 projMat; uniform float ndcR; uniform vec3 petal; uniform vec3 lightDir;
    varying vec3 vW; varying vec3 vN; varying vec2 vUv;
    void main(){
      vec4 p = projMat*vec4(vW,1.0);
      vec2 ndc = p.xy/p.w;
      vec2 uv = ndc/ndcR*0.5+0.5;
      float d = length(uv-0.5);
      vec3 base = petal;
      if(d<0.5){
        vec3 img = texture2D(map,uv).rgb;
        float soft = smoothstep(0.5,0.47,d);
        base = mix(petal,img,soft);
      }
      vec3 n = normalize(gl_FrontFacing ? vN : -vN);
      float lam = clamp(dot(n,lightDir),0.0,1.0);
      float rim = smoothstep(0.0,0.18,min(vUv.x,1.0-vUv.x));
      // gentle shading on the picture, stronger on plain petal so the shapes read
      float inPic = d<0.5 ? 1.0 : 0.0;
      float shade = mix(mix(0.8,1.08,lam), mix(0.93,1.03,lam), inPic);
      shade *= mix(mix(0.8,1.0,rim), mix(0.97,1.0,rim), inPic);
      gl_FragColor = vec4(base*shade,1.0);
    }`
});

// Petal: teardrop outline, cupped across its width, curled along its length.
function petalGeo(L,W,cup,curl){
  const g = new THREE.PlaneGeometry(1,1,14,24);
  const pos = g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const u = pos.getX(i)+0.5, v = pos.getY(i)+0.5;   // 0..1
    const half = Math.pow(Math.sin(Math.PI*Math.pow(v,0.75)),0.85)*W*0.5;
    const xn = (u-0.5)*2;
    const x = xn*half;
    const y = v*L;
    const z = cup*(xn*xn)*(half/(W*0.5)+0.15) + curl*v*v;
    pos.setXYZ(i,x,y,z);
  }
  g.computeVertexNormals();
  return g;
}

const flower = new THREE.Group(); scene.add(flower);
function ring(n,r0,L,W,cup,curl,tilt,z,off,jit){
  for(let k=0;k<n;k++){
    const a = off + k/n*Math.PI*2 + (Math.sin(k*12.9898)*0.5)*jit;
    const pivot = new THREE.Group();
    pivot.position.z = z + Math.sin(k*7.1)*0.06;
    pivot.rotation.z = a - Math.PI/2;
    const holder = new THREE.Group();
    holder.position.y = r0;
    holder.rotation.x = tilt + Math.sin(k*3.3)*0.08;
    const m = new THREE.Mesh(petalGeo(L*(1+Math.sin(k*5.7)*0.05),W,cup,curl), projMaterial);
    holder.add(m); pivot.add(holder); flower.add(pivot);
  }
}
// back cup so the picture has no holes from the front
const back = new THREE.Mesh(new THREE.SphereGeometry(9,64,16,0,Math.PI*2,0,0.44), projMaterial);
back.rotation.x = -Math.PI/2; back.position.z = 5.2;
flower.add(back);
ring(13,0.7,4.2,2.1,0.35,-0.6,-0.3,-1.0,0.0,0.15);   // outer, leaning back
ring(10,0.45,2.8,1.75,0.4,-0.2,0.12,-0.35,0.31,0.2);   // middle
ring(7,0.25,1.9,1.4,0.45,0.25,0.62,0.25,0.12,0.2);     // inner, cupped forward
const bud = new THREE.Mesh(new THREE.SphereGeometry(0.62,32,16), projMaterial);
bud.scale.set(1,1,0.75); bud.position.z = 0.55; flower.add(bud);

// stem + leaves (plain green, they sit outside the picture)
const green = new THREE.MeshStandardMaterial({color:0x3f8f4e, roughness:.7, side:THREE.DoubleSide});
const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,-1.0,-4.2), new THREE.Vector3(0.3,-4,-4.4), new THREE.Vector3(-0.2,-7,-4.1), new THREE.Vector3(0.1,-11,-3.9)]);
flower.add(new THREE.Mesh(new THREE.TubeGeometry(curve,40,0.18,10,false), green));
function leaf(y,side){
  const m = new THREE.Mesh(petalGeo(2.6,1.2,0.25,0.5), green);
  m.position.set(0.15*side,y,-4.25); m.rotation.z = side*(-1.15); m.rotation.y = side*0.5;
  flower.add(m);
}
leaf(-5.6,1); leaf(-7.4,-1);
scene.add(new THREE.HemisphereLight(0xffffff,0x334433,0.9));
const dl = new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(-3,5,6); scene.add(dl);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enablePan = false; controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 9; controls.maxDistance = 24;
controls.rotateSpeed = 0.7;

function setAngles(az,el,dist){
  camera.position.set(dist*Math.cos(el)*Math.sin(az), dist*Math.sin(el), dist*Math.cos(el)*Math.cos(az));
  camera.lookAt(0,0,0);
}

// Animation state: intro sweep into the sweet spot, then hold.
let mode = 'intro', t0 = performance.now(), from = null;
const startAz = 1.05, startEl = 0.32;
setAngles(startAz,startEl,D);
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

function current(){
  const v = camera.position.clone();
  const dist = v.length();
  return {az:Math.atan2(v.x,v.z), el:Math.asin(v.y/dist), dist};
}
function startSnap(){ from = current(); mode='snap'; t0=performance.now(); wobBtn.classList.remove('on'); }
const wobBtn = document.getElementById('wob');
document.getElementById('snap').onclick = startSnap;
wobBtn.onclick = ()=>{
  if(mode==='wobble'){ mode='free'; wobBtn.classList.remove('on'); }
  else { from=current(); mode='wobble'; t0=performance.now(); wobBtn.classList.add('on'); }
};
renderer.domElement.addEventListener('pointerdown',()=>{ if(mode!=='free'){mode='free'; wobBtn.classList.remove('on');} });

const status = document.getElementById('status');
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h); camera.aspect=w/h;
  // keep the whole flower in view on tall phones
  camera.fov = w/h < 0.8 ? 35*Math.min(2.1,0.95/(w/h)) : 35;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

function loop(now){
  requestAnimationFrame(loop);
  const t = (now - t0)/1000;
  if(mode==='intro'){
    const k = ease(Math.min(1,Math.max(0,(t-0.6)/2.6)));
    setAngles(startAz*(1-k), startEl*(1-k), D);
    if(t>3.2){ mode='hold'; t0=now; }
  } else if(mode==='hold'){
    if(t>2.2){ from=current(); mode='wobble'; t0=now; wobBtn.classList.add('on'); }
  } else if(mode==='snap'){
    const k = ease(Math.min(1,t/1.2));
    setAngles(from.az*(1-k), from.el*(1-k), from.dist+(D-from.dist)*k);
    if(k>=1){ mode='free'; }
  } else if(mode==='wobble'){
    const blend = Math.min(1,t/1.5);
    const az = Math.sin(t*0.55)*0.85, el = Math.sin(t*0.37)*0.22;
    setAngles(from.az*(1-blend)+az*blend, from.el*(1-blend)+el*blend, from.dist+(D-from.dist)*blend);
  }
  if(mode==='free') controls.update(); else controls.target.set(0,0,0);

  const c = current();
  const off = Math.round(Math.hypot(c.az,c.el)*180/Math.PI);
  if(off<=2 && Math.abs(c.dist-D)<0.6){ status.textContent='Sweet spot'; status.className='hit'; }
  else { status.textContent = mode==='free' ? 'Off center by '+off+'°' : 'Drag to turn it'; status.className=''; }
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
window.__set=(az,el)=>{mode='test';setAngles(az,el,D);};
})();
