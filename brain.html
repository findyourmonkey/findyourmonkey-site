<style>

<script>
(function(){

// ---- a brain-shaped cloud: two hemispheres, temporal lobes, cerebellum and stem ----

(function(){
  var tries=0;
  while(CLOUD.length<(mobile?5200:8000)&&tries<200000){tries++;
    var x=rnd(),y=rnd(),z=rnd(),lb=-1;

// glow sprite texture

var pts,ptsGeo,lines,lineGeo,nodeLobe=[],base=[],heat,edgeArr=[],lobeNodes=[],lobeCenter=[],labels=[],data=null,tissue,tissueGlow,tissueLobe=[];
var vs='attribute float size;attribute vec3 color;attribute float glow;varying vec3 vC;varying float vG;uniform float px;void main(){vC=color;vG=glow;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*(1.+glow*1.6)*px*(120./-mv.z);gl_Position=projectionMatrix*mv;}';

  for(var i=0;i<d.lobes.length;i++){lobeNodes[i]=[];lobeCenter[i]=new THREE.Vector3()}
  for(i=0;i<N;i++){
    var n=d.nodes[i],lb=Math.min(n[0],HOME.length-1),p=place(lb);
    pos.set([p.x,p.y,p.z],i*3);var c=new THREE.Color(COLORS[lb]);col.set([c.r,c.g,c.b],i*3);

  }

  var free=CLOUD.filter(function(c){return !c.used}),M=free.length,tp=new Float32Array(M*3),tc=new Float32Array(M*3),ts=new Float32Array(M);tissueGlow=new Float32Array(M);
  free.forEach(function(c,q){tp.set([c.p.x,c.p.y,c.p.z],q*3);var cc=new THREE.Color(COLORS[c.lb]).lerp(new THREE.Color(0x8a7a9a),.35);tc.set([cc.r,cc.g,cc.b],q*3);ts[q]=.7+Math.random()*.6;tissueLobe[q]=c.lb});
  var tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(tp,3));tg.setAttribute('color',new THREE.BufferAttribute(tc,3));tg.setAttribute('size',new THREE.BufferAttribute(ts,1));tg.setAttribute('glow',new THREE.BufferAttribute(tissueGlow,1));

var nbr=[];

// ambient dust shell
(function(){var M=900,p=new Float32Array(M*3);for(var i=0;i<M;i++){var v=new THREE.Vector3(rnd(),rnd(),rnd()).normalize().multiplyScalar(1.15+Math.random()*.9);p.set([v.x*SC[0],v.y*SC[1],v.z*SC[2]],i*3)}

var rings=[];
[[19,0xe8834f,.18],[22,0x5fd9b4,.1]].forEach(function(r,i){var m=new THREE.Mesh(new THREE.TorusGeometry(r[0],.03,6,160),new THREE.MeshBasicMaterial({color:r[1],transparent:true,opacity:r[2]}));m.rotation.x=Math.PI/2+(i?.35:-.2);m.rotation.y=i?.3:-.1;S.add(m);m.userData.spin=i?-.04:.06;rings.push(m)});

var SIG=mobile?90:180,sigPos=new Float32Array(SIG*3),sigCol=new Float32Array(SIG*3),sigSize=new Float32Array(SIG),sigGlow=new Float32Array(SIG),sigs=[];

  for(var q=0;q<n;q++){var i=lobeNodes[lobe][Math.floor(Math.random()*lobeNodes[lobe].length)];heat[i]=Math.min(1,heat[i]+.9);if(q<4)spawn(i,2+Math.floor(Math.random()*3))}
  lobeHot[lobe]=1;
  if(tissueGlow)for(var q2=0;q2<tissueGlow.length;q2++)if(tissueLobe[q2]===lobe&&Math.random()<.5*strength)tissueGlow[q2]=Math.min(1,tissueGlow[q2]+.5);
}

// ---------- data ----------
function fmt(n){return n==null?'—':Number(n).toLocaleString('en-US')}
function ago(t){var s=Math.max(0,Math.round(Date.now()/1000-t));return s<60?s+'s ago':Math.round(s/60)+'m ago'}
var feed=document.getElementById('feed'),lastT=0,queue=[];
function pushEv(ev){
  var L=data.lobes[ev[0]];if(!L)return;
  var row=document.createElement('div');row.className='ev';row.style.setProperty('--c',COLORS[ev[0]]);
  row.innerHTML='<b></b><span></span><em></em>';row.children[0].textContent=L.name;row.children[1].textContent=L.verb;row.children[2].textContent=ago(ev[1]);row.dataset.t=ev[1];
  feed.insertBefore(row,feed.children[1]);while(feed.children.length>8)feed.removeChild(feed.lastChild);
  fire(ev[0],1.3);
}
setInterval(function(){[].forEach.call(feed.querySelectorAll('.ev'),function(r){r.lastChild.textContent=ago(+r.dataset.t)})},1000);

function apply(d,first){
  if(first){data=d;build(d)}else{data.stats=d.stats;d.lobes.forEach(function(L,i){if(data.lobes[i]){data.lobes[i].fire=L.fire}})}
  document.getElementById('sNeurons').textContent=fmt(d.stats.neurons);
  document.getElementById('sSyn').textContent=fmt(d.stats.synapses);
  document.getElementById('sSig').textContent=fmt(d.stats.signals_10m);
  document.getElementById('sNew').textContent=fmt(d.stats.new_today);
  var mx=Math.max.apply(null,d.lobes.map(function(L){return Math.log(1+L.fire)}))||1;
  data.lobes.forEach(function(L){L._row.querySelector('i').style.width=(Math.log(1+L.fire)/mx*100)+'%'});
  var age=Math.round(Date.now()/1000-d.generated);
  document.getElementById('liveTxt').textContent=age<600?'LIVE':'LAST SYNC '+Math.round(age/60)+' MIN AGO';
  var evs=d.events.filter(function(e){return e[1]>lastT});
  if(first){ // catch up: replay the recent past quickly, newest last
    evs.slice(-14).forEach(function(e,i){setTimeout(function(){pushEv(e)},(reduce?300:2500)+i*420)});
  }else{
    var span=Math.max(1,evs.length);evs.forEach(function(e,i){setTimeout(function(){pushEv(e)},i*(110000/span))});
  }
  if(d.events.length)lastT=Math.max(lastT,d.events[d.events.length-1][1]);
}
function load(first){
  fetch(FEED+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){if(d&&d.nodes)apply(d,first)}).catch(function(){
    if(first){document.getElementById('liveTxt').textContent='OFFLINE · REPLAY';fallback()}
  });
}
function fallback(){ // feed unreachable: still show a living brain, clearly marked as a replay
  var lobes=['Clip Engine','Memory','Language','Imagination','Resale','Outreach','Client Work','Senses','Self'],verbs=['cutting a clip','remembering a word','routing a thought','drawing a character','pricing an item','finding a new show','serving a client','hearing the world','checking itself'];
  var nodes=[];for(var i=0;i<700;i++)nodes.push([i%9,Math.random(),0]);
  apply({generated:Date.now()/1000,stats:{},lobes:lobes.map(function(n,i){return{name:n,verb:verbs[i],fire:5}}),nodes:nodes,edges:[],events:[]},true);
  document.getElementById('liveTxt').textContent='OFFLINE · REPLAY';
}
load(true);setInterval(function(){load(false)},120000);
fetch('clips.json?t='+Date.now()).then(function(r){return r.json()}).then(function(c){document.getElementById('sViews').textContent=fmt(c.total_views)}).catch(function(){});

// ---------- interaction ----------
var az=1.05,el=.22,dist=mobile?62:46,drag=false,px=0,py=0,last=performance.now(),pinch=0;
cv.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;py=e.clientY;last=performance.now()});
addEventListener('pointerup',function(){drag=false});
addEventListener('pointermove',function(e){if(!drag)return;az-=(e.clientX-px)*.006;el=Math.max(-.9,Math.min(.9,el+(e.clientY-py)*.004));px=e.clientX;py=e.clientY;last=performance.now()});
cv.addEventListener('wheel',function(e){e.preventDefault();dist=Math.max(26,Math.min(90,dist*(1+e.deltaY*.001)))},{passive:false});
cv.addEventListener('touchmove',function(e){if(e.touches.length===2){var a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)dist=Math.max(26,Math.min(95,dist*pinch/d));pinch=d;drag=false}},{passive:true});
cv.addEventListener('touchend',function(){pinch=0},{passive:true});
cv.addEventListener('click',function(){ // tap anywhere to make the brain think
  if(!data)return;var l=Math.floor(Math.random()*data.lobes.length);fire(l,1.6);
});

function resize(){mobile=innerWidth<760;R.setSize(innerWidth,innerHeight,false);CAM.aspect=innerWidth/innerHeight;var portrait=innerWidth<innerHeight;if(portrait)CAM.setViewOffset(innerWidth,innerHeight,0,innerHeight*.07,innerWidth,innerHeight);else CAM.clearViewOffset();CAM.updateProjectionMatrix();dist=portrait?Math.min(112,45/(innerWidth/innerHeight)):46}
addEventListener('resize',resize);resize();

// ---------- loop ----------
var clock=new THREE.Clock(),v3=new THREE.Vector3(),amb=0;
function tick(){
  var dt=Math.min(clock.getDelta(),.05),T=clock.elapsedTime;
  if(!drag&&performance.now()-last>2500)az+=dt*(reduce?.02:.12);
  CAM.position.set(dist*Math.cos(el)*Math.sin(az),dist*Math.sin(el),dist*Math.cos(el)*Math.cos(az));CAM.lookAt(0,0,0);
  brain.position.y=Math.sin(T*.6)*.4;
  rings.forEach(function(r){r.rotation.z+=dt*r.userData.spin});
  if(data){
    // ambient firing, proportional to each region's real activity over the last 10 minutes
    amb+=dt;if(amb>(reduce?1.6:.35)){amb=0;var tot=0;data.lobes.forEach(function(L){tot+=Math.sqrt(L.fire+1)});var r=Math.random()*tot;for(var i=0;i<data.lobes.length;i++){r-=Math.sqrt(data.lobes[i].fire+1);if(r<=0){fire(i,.45);break}}}
    for(i=0;i<heat.length;i++)heat[i]*=Math.pow(.25,dt); // decay
    // a slow breathing shimmer
    var sh=Math.floor(Math.random()*heat.length);heat[sh]=Math.max(heat[sh],.35);
    ptsGeo.attributes.glow.needsUpdate=true;
    for(i=0;i<tissueGlow.length;i++)tissueGlow[i]*=Math.pow(.18,dt);tissue.geometry.attributes.glow.needsUpdate=true;
    lines.material.opacity=.09+.03*Math.sin(T*1.3);
    for(i=0;i<SIG;i++){var s=sigs[i];if(!s.on)continue;s.t+=dt*s.v;
      if(s.t>=1){heat[s.b]=Math.min(1,heat[s.b]+.6);if(s.hops>0&&nbr[s.b]&&nbr[s.b].length){s.a=s.b;s.b=nbr[s.a][Math.floor(Math.random()*nbr[s.a].length)];s.t=0;s.hops--}else{s.on=false;sigPos[i*3+1]=9999;continue}}
      v3.copy(base[s.a]).lerp(base[s.b],s.t);sigPos.set([v3.x,v3.y,v3.z],i*3);sigGlow[i]=.8+.2*Math.sin(T*20)}
    sg.attributes.position.needsUpdate=true;sg.attributes.glow.needsUpdate=true;sg.attributes.color.needsUpdate=true;
    // labels follow their region
    labels.forEach(function(lab,i){lobeHot[i]=(lobeHot[i]||0)*Math.pow(.2,dt);
      v3.copy(lobeCenter[i]).multiplyScalar(1.18);v3.y+=brain.position.y;v3.project(CAM);
      var vis=v3.z<1&&lobeNodes[i].length>0;lab.style.display=vis?'block':'none';
      var lx=(v3.x+1)/2*innerWidth,ly=(1-v3.y)/2*innerHeight,hw=lab.offsetWidth/2+8;lab.style.left=Math.max(hw,Math.min(innerWidth-hw,lx))+'px';lab.style.top=ly+'px';
      var hot=lobeHot[i]>.35;lab.classList.toggle('hot',hot);if(data.lobes[i]._row)data.lobes[i]._row.classList.toggle('hot',hot)});
  }
  R.render(S,CAM);requestAnimationFrame(tick);
}
tick();
})();
</script>
</body>
