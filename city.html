/* layout: one full-bleed night scene (a floating island city); glass HUD pinned to the corners, bottom sheet for the building card */
:root{
  --night:#0b0918; --glass:rgba(22,15,34,.66); --glass-line:rgba(245,237,225,.16);
  --cream:#f5ede1; --tan:#cdb39a; --orange:#e8834f; --gold:#f2c14e; --mint:#5fd9b4; --red:#e8695a; --dim:#7d6f8a;
  --display:'Syne','Trebuchet MS',system-ui,sans-serif; --body:'Inter',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;position:relative}
#c{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.hud{position:absolute;z-index:2;pointer-events:none}
#brand{top:16px;left:var(--gl);display:flex;gap:12px;align-items:center}
#brand svg{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 14px rgba(232,131,79,.65))}
#brand h1{font-family:var(--display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.01em;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.6)}
#brand p{margin:5px 0 0;font-size:12px;color:var(--tan);letter-spacing:.02em;text-shadow:0 1px 8px rgba(0,0,0,.7)}
#live{top:76px;left:var(--gl);font-family:var(--mono);font-size:11px;color:var(--mint);max-width:min(70vw,760px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(0,0,0,.8)}
#live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);margin-right:8px;box-shadow:0 0 10px var(--mint);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.3}}
#stats{top:16px;right:var(--gr);display:flex;gap:22px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(0,0,0,.8)}
#stats b{display:block;font-size:22px;color:var(--gold);font-weight:500;line-height:1.1}
#stats span{font-size:10px;color:var(--tan);letter-spacing:.08em;text-transform:uppercase}
#foot{left:var(--gl);right:var(--gr);bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

#legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0;box-shadow:0 0 8px currentColor}

#fit{position:absolute;z-index:3;right:var(--gr);bottom:44px;background:var(--glass);color:var(--cream);border:1px solid var(--glass-line);border-radius:999px;padding:9px 15px;font:500 12px var(--body);cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#fit:focus-visible,#x:focus-visible,#pa:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#tip{position:absolute;z-index:3;pointer-events:none;background:var(--glass);border:1px solid var(--glass-line);padding:6px 10px;border-radius:8px;font-size:12px;transform:translate(-50%,-150%);white-space:nowrap;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#tip small{color:var(--tan);margin-left:8px;font-family:var(--mono);font-size:10px}
#panel{position:absolute;z-index:4;left:var(--gl);bottom:44px;width:min(360px,calc(100% - var(--gl) - var(--gr)));box-sizing:border-box;background:var(--glass);border:1px solid var(--glass-line);border-radius:16px;padding:16px 18px 18px;box-shadow:0 24px 70px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transform:translateY(14px);opacity:0;transition:transform .28s,opacity .28s;pointer-events:none}
#panel.on{transform:none;opacity:1;pointer-events:auto}
#pd{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tan)}
#ph{font-family:var(--display);font-size:22px;margin:4px 30px 8px 0;font-weight:800;text-wrap:balance;line-height:1.1}
#ps{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:3px 9px;border-radius:999px;border:1px solid currentColor;margin-bottom:10px}
#pp{margin:0;font-size:13.5px;line-height:1.55;color:var(--cream)}
#pa{display:inline-block;margin-top:14px;background:var(--orange);color:#1a0f0a;font-weight:500;text-decoration:none;padding:9px 16px;border-radius:999px;font-size:13px}
#x{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--tan);font-size:20px;line-height:1;cursor:pointer;padding:8px 10px}

  #brand{gap:9px}#brand svg{width:34px;height:34px}#brand h1{font-size:19px}#brand p{font-size:10px;margin-top:3px}

  #foot{bottom:12px}#legend{font-size:9.5px;gap:4px 9px}#fresh{display:none}
  #fit{bottom:96px}

}
@media (prefers-reduced-motion:reduce){#live::before{animation:none}#panel{transition:none}}
#brand{pointer-events:auto;text-decoration:none;color:inherit}
#brand img{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 14px rgba(232,131,79,.55))}
#nav{position:absolute;z-index:3;left:var(--gl);bottom:44px;display:flex;gap:8px}
#nav a{font:500 12px var(--body);text-decoration:none;padding:9px 15px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);color:var(--cream);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#nav a.p{background:var(--orange);color:#1a0f0a;border-color:var(--orange)}
#nav a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:640px){#brand img{width:34px;height:34px}#nav{bottom:96px}}
</style>

  else if(!mouseOK&&!tip.hidden)tip.hidden=true;
  if(composer)composer.render();else R.render(S,CAM);
  requestAnimationFrame(tick);
}
tick();
}

(async function boot(){
  let DATA=SNAPSHOT;
  try{ if(window.claude&&claude.use){ const db=await claude.use('db'); if(db){ const snap=await Promise.race([db.doc('city/state').get(),new Promise(r=>setTimeout(()=>r(null),4000))]); const d=snap&&snap.exists?snap.data():null;
        if(d&&Array.isArray(d.buildings)&&d.buildings.length&&d.districts) DATA=d; } } }catch(e){}
  try{ if(document.fonts&&document.fonts.load) await Promise.race([document.fonts.load('800 46px Syne'),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  start(DATA);
})();
